<!doctype html>
<html lang="pt_BR">
  <head>
    <meta charset="UTF-8" />
    <title>Sistema Mentoria</title>

    <!-- VIEWPORT - DESKTOP-ONLY -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- CSS BASE -->
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/home.css" />
    <link rel="stylesheet" href="./css/components.css" />

    <!-- CSS MODULES -->
    <link rel="stylesheet" href="./css/agenda.css" />
    <link rel="stylesheet" href="./css/receitas.css" />
    <link rel="stylesheet" href="./css/despesas.css" />
    <link rel="stylesheet" href="./css/pendencias.css" />
    <link rel="stylesheet" href="./css/alunos.css" />
    <link rel="stylesheet" href="./css/professores.css" />
    <link rel="stylesheet" href="./css/financeiro.css" />
  </head>

  <body>
    <!-- HEADER -->
    <header class="header">
      <div class="header-left">
        <img
          src="./assets/img/mentoria-logo.png"
          alt="Mentoria"
          class="logo"
          id="btn-home"
        />
      </div>

      <div class="header-right">
        <button
          id="themeToggle"
          class="theme-btn"
          title="Alternar tema"
          type="button"
        >
          🌙
        </button>

        <button class="menu-btn" title="Menu" type="button">☰</button>
      </div>
    </header>

    <!-- MENU (HAMBURGER) -->
    <nav id="menu" class="menu hidden">
      <ul>
        <li data-route="home">Home</li>
        <li data-route="agenda">Agenda</li>
        <li data-route="alunos">Alunos</li>
        <li data-route="professores">Professores</li>
        <li data-route="receitas">Receitas</li>
        <li data-route="despesas">Despesas</li>
        <li data-route="financeiro">Financeiro</li>
        <li data-route="pendencias">Pendências</li>
        <li data-route="matricula">Matrícula</li>
        <li data-route="galeria">Galeria</li>
        <li data-route="logout">Sair</li>
      </ul>
    </nav>

    <!-- APP -->
    <main id="app">
      <section id="home"></section>

      <section id="agenda" class="hidden">
        <div class="module-frame">
          <div class="module-header">
            <h1 class="module-title">Agenda</h1>
          </div>

          <div class="module-body">
            <!-- Conteúdo da Agenda -->
          </div>
        </div>
      </section>
      <section id="alunos" class="hidden">
        <div class="module-frame">
          <div class="module-header">
            <h1 class="module-title">Alunos</h1>
          </div>

          <div class="module-body">
            <!-- Conteúdo da Alunos -->
          </div>
        </div>
      </section>
      <section id="professores" class="hidden">
        <div class="module-frame">
          <div class="module-header">
            <h1 class="module-title">Professores</h1>
          </div>

          <div class="module-body">
            <!-- Conteúdo da Professores -->
          </div>
        </div>
      </section>
      <section id="receitas" class="hidden">
        <div class="module-frame">
          <div class="module-header">
            <h1 class="module-title">Receitas</h1>
          </div>

          <div class="module-body">
            <!-- Conteúdo da Receitas -->
          </div>
        </div>
      </section>
      <section id="despesas" class="hidden">
        <div class="module-frame">
          <div class="module-header">
            <h1 class="module-title">Despesas</h1>
          </div>

          <div class="module-body">
            <!-- Conteúdo da Despesas -->
          </div>
        </div>
      </section>
      <section id="financeiro" class="hidden">
        <div class="module-frame">
          <div class="module-header">
            <h1 class="module-title">Financeiro</h1>
          </div>

          <div class="module-body">
            <!-- Conteúdo da Financeiro -->
          </div>
        </div>
      </section>
      <section id="pendencias" class="hidden">
        <div class="module-frame">
          <div class="module-header">
            <h1 class="module-title">Pendências</h1>
          </div>

          <div class="module-body">
            <!-- Conteúdo da Pendências -->
          </div>
        </div>
      </section>
      <section id="matricula" class="hidden">
        <div class="module-frame">
          <div class="module-header">
            <h1 class="module-title">Matrícula</h1>
          </div>

          <div class="module-body">
            <!-- Conteúdo da Matrícula -->
          </div>
        </div>
      </section>
      <section id="galeria" class="hidden">
        <div class="module-frame">
          <div class="module-header">
            <h1 class="module-title">Galeria</h1>
          </div>

          <div class="module-body">
            <!-- Conteúdo da Galeria -->
          </div>
        </div>
      </section>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
      <span class="status">
        Sistema Mentoria v1.0
        <span class="dot" id="connDot"></span>
        <span id="connText">Desconectado</span>
      </span>
    </footer>

    <!-- JS CORE -->
    <script src="./js/core/router.js"></script>

    <!-- JS MODULES -->
    <script src="./js/modules/home.js"></script>
    <script src="./js/modules/agenda.js"></script>
    <script src="./js/modules/receitas.js"></script>
    <script src="./js/modules/despesas.js"></script>
    <script src="./js/modules/pendencias.js"></script>
    <script src="./js/modules/alunos.js"></script>
    <script src="./js/modules/professores.js"></script>
    <script src="./js/modules/financeiro.js"></script>
  </body>
</html>
