<!doctype html>
<html lang="pt_BR">
  <head>
    <meta charset="UTF-8" />
    <title>Sistema Mentoria</title>

    <!-- VIEWPORT - DESKTOP-ONLY -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- CSS BASE -->
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/home.css" />
  </head>

  <body>
    <!-- HEADER -->
    <header class="header">
      <div class="header-left">
        <img
          src="./assets/img/mentoria-logo.png"
          alt="Mentoria"
          class="logo"
          id="btn-home"
        />
      </div>

      <div class="header-right">
        <button
          id="themeToggle"
          class="theme-btn"
          title="Alternar tema"
          type="button"
        >
          🌙
        </button>

        <button class="menu-btn" title="Menu" type="button">☰</button>
      </div>
    </header>

    <!-- APP -->
    <main id="app"></main>

    <!-- FOOTER -->
    <footer class="footer">
      <span class="status">
        Sistema Mentoria v1.0
        <span class="dot"></span>
        Conectado
      </span>
    </footer>

    <!-- JS CORE -->
    <script src="./js/core/router.js"></script>

    <!-- JS MODULES -->
    <script src="./js/modules/home.js"></script>
  </body>
</html>
