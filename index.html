<!doctype html>
<html lang="pt_BR">
  <head>
    <meta charset="UTF-8" />
    <title>Sistema Mentoria</title>

    <!-- VIEWPORT - DESKTOP-ONLY -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- CSS BASE -->
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/home.css" />
  </head>

  <body>
    <!-- HEADER -->
    <header class="header">
      <div class="header-left">
        <img
          src="./assets/img/mentoria-logo.png"
          alt="Mentoria"
          class="logo"
          id="btn-home"
        />
      </div>

      <div class="header-right">
        <button
          id="themeToggle"
          class="theme-btn"
          title="Alternar tema"
          type="button"
        >
          🌙
        </button>

        <button class="menu-btn" title="Menu" type="button">☰</button>
      </div>
    </header>

    <!-- MENU (HAMBURGER) -->
    <nav id="menu" class="menu hidden">
      <ul>
        <li data-route="home">Home</li>
        <li data-route="agenda">Agenda</li>
        <li data-route="alunos">Alunos</li>
        <li data-route="professores">Professores</li>
        <li data-route="receitas">Receitas</li>
        <li data-route="despesas">Despesas</li>
        <li data-route="financeiro">Financeiro</li>
        <li data-route="pendencias">Pendências</li>
        <li data-route="matricula">Matrícula</li>
        <li data-route="galeria">Galeria</li>
        <li data-route="logout">Sair</li>
      </ul>
    </nav>

    <!-- APP -->
    <main id="app">
      <section id="home"></section>
      <section id="agenda" class="hidden"></section>
      <section id="alunos" class="hidden"></section>
      <section id="professores" class="hidden"></section>
      <section id="receitas" class="hidden"></section>
      <section id="despesas" class="hidden"></section>
      <section id="financeiro" class="hidden"></section>
      <section id="pendencias" class="hidden"></section>
      <section id="matricula" class="hidden"></section>
      <section id="galeria" class="hidden"></section>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
      <span class="status">
        Sistema Mentoria v1.0
        <span class="dot" id="connDot"></span>
        <span id="connText">Desconectado</span>
      </span>
    </footer>

    <!-- JS CORE -->
    <script src="./js/core/router.js"></script>

    <!-- JS MODULES -->
    <script src="./js/modules/home.js"></script>
  </body>
</html>
